
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LOCAL MARKET | Forgot Password</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

<style>
:root {
    --green:#174d38;
    --cream:#f7f7ef;
}
body {
    margin:0;
    min-height:100vh;
    background:var(--cream);
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
    font-family:Arial,sans-serif;
}
.reset-card {
    width:100%;
    max-width:440px;
    background:white;
    padding:38px;
    border-radius:20px;
    box-shadow:0 12px 40px #173c2812;
}
.brand {
    color:var(--green);
    font-size:24px;
    font-weight:800;
}
.brand span {color:#9a9b62;}
.icon-circle {
    width:75px;
    height:75px;
    border-radius:50%;
    background:#edf5ee;
    color:var(--green);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:30px;
    margin:25px auto;
}
h2 {
    font-weight:800;
    color:#203b2b;
}
.subtitle {
    color:#78847c;
    font-size:14px;
    line-height:1.6;
}
.form-control {
    padding:13px;
    border-radius:9px;
}
.form-control:focus {
    border-color:var(--green);
    box-shadow:0 0 0 3px #174d3815;
}
.btn-green {
    background:var(--green);
    color:white;
    border:0;
    padding:13px;
    border-radius:9px;
    width:100%;
    font-weight:bold;
}
.btn-green:hover {
    background:#236849;
    color:white;
}
a {
    color:var(--green);
    text-decoration:none;
    font-weight:600;
}
</style>
</head>

<body>

<div class="reset-card">

    <div class="text-center">
        <div class="brand">LOCAL <span>MARKET.</span></div>

        <div class="icon-circle">
            <i class="bi bi-lock"></i>
        </div>

        <h2>Forgot Password?</h2>
        <p class="subtitle">
            Don't worry! Enter your registered email address.
            We will help you reset your password.
        </p>
    </div>

    <form id="resetForm">

        <label class="form-label fw-bold small">Registered Email Address</label>

        <input
            type="email"
            class="form-control mb-4"
            id="email"
            placeholder="Enter your registered email"
            required
        >

        <button type="submit" class="btn-green">
            Send Reset Link <i class="bi bi-arrow-right"></i>
        </button>

    </form>

    <div id="message" class="text-center small mt-3"></div>

    <div class="text-center mt-4">
        <a href="/login">
            <i class="bi bi-arrow-left"></i> Back to Login
        </a>
    </div>

</div>

<script>
document.getElementById('resetForm').addEventListener('submit',function(e) {
    e.preventDefault();

    document.getElementById('message').textContent =
        'Password reset backend is not connected yet.';

    document.getElementById('message').style.color = '#174d38';
});
</script>

</body>
</html>
