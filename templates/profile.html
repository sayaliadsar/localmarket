<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Profile - Local Market</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: Inter, system-ui, sans-serif;
}
body {
  background: #f8fafc;
  padding-bottom: 90px;
}
header {
  background: #fff;
  padding: 14px 16px;
  position: sticky;
  top: 0;
  z-index: 10;
  box-shadow: 0 2px 10px rgba(0,0,0,.06);
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.logo {
  font-size: 22px;
  font-weight: 900;
}
.logo span {
  color: #16a34a;
}
.card {
  background: #fff;
  border-radius: 16px;
  padding: 16px;
  margin: 12px;
  box-shadow: 0 2px 8px rgba(0,0,0,.05);
}
.card h3 {
  margin-bottom: 10px;
}
.profile-top {
  display: flex;
  gap: 14px;
  align-items: center;
}
.profile-top img {
  width: 72px;
  height: 72px;
  border-radius: 50%;
  object-fit: cover;
  border: 3px solid #dcfce7;
}
.badge {
  display: inline-block;
  padding: 4px 10px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: 700;
}
.badge-pro {
  background: #f59e0b;
  color: #fff;
}
.badge-free {
  background: #e2e8f0;
  color: #555;
}
.btn {
  width: 100%;
  padding: 12px;
  border: none;
  border-radius: 12px;
  font-weight: 800;
  cursor: pointer;
  margin-top: 8px;
}
.btn-green {
  background: #16a34a;
  color: #fff;
}
.btn-dark {
  background: #111827;
  color: #fff;
}
.btn-red {
  background: #ef4444;
  color: #fff;
}
.btn-orange {
  background: #f59e0b;
  color: #fff;
}
input,
select,
textarea {
  width: 100%;
  padding: 12px;
  border: 1px solid #ddd;
  border-radius: 10px;
  margin: 6px 0;
}
label {
  font-size: 12px;
  font-weight: 700;
  color: #555;
}
.tabs {
  display: flex;
  gap: 8px;
  padding: 0 12px;
  overflow-x: auto;
}
.tabs button {
  white-space: nowrap;
  padding: 9px 16px;
  border: none;
  border-radius: 20px;
  background: #fff;
  font-weight: 700;
  font-size: 13px;
  cursor: pointer;
  border: 1px solid #e2e8f0;
}
.tabs button.active {
  background: #16a34a;
  color: #fff;
}
.tab {
  display: none;
}
.tab.active {
  display: block;
}
.p-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}
.p-card {
  background: #fff;
  border-radius: 14px;
  overflow: hidden;
  box-shadow: 0 2px 8px rgba(0,0,0,.05);
}
.p-card img {
  width: 100%;
  height: 120px;
  object-fit: cover;
}
.p-card-body {
  padding: 10px;
}
.p-card-body b {
  font-size: 13px;
  display: block;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.order-card {
  background: #f8fafc;
  border: 1px solid #e2e8f0;
  border-radius: 12px;
  padding: 12px;
  margin-bottom: 10px;
  display: flex;
  gap: 10px;
  align-items: center;
}
.order-card img {
  width: 60px;
  height: 60px;
  object-fit: cover;
  border-radius: 10px;
}
.modal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.6);
  z-index: 100;
  justify-content: center;
  align-items: flex-end;
}
.modal.open {
  display: flex;
}
.modal-box {
  background: #fff;
  width: 100%;
  max-width: 480px;
  max-height: 92vh;
  overflow-y: auto;
  border-radius: 20px 20px 0 0;
  padding: 20px;
  position: relative;
}
.close {
  position: absolute;
  right: 16px;
  top: 12px;
  border: none;
  background: #f1f5f9;
  width: 32px;
  height: 32px;
  border-radius: 50%;
  font-size: 18px;
  cursor: pointer;
  z-index: 10;
}
#map {
  height: 220px;
  border-radius: 14px;
  margin-top: 8px;
  z-index: 1;
  border: 2px solid #e2e8f0;
}
.bottom {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: #fff;
  display: flex;
  justify-content: space-around;
  padding: 10px 0;
  border-top: 1px solid #eee;
  z-index: 20;
}{% if request.args.get('msg') %}
<div class="toast">{{ request.args.get('msg') }}</div>
{% endif %}

<header>
  <div class="logo">Local<span>Market</span></div>
  <a href="/logout" style="color:#ef4444;text-decoration:none;font-weight:800;font-size:13px">Logout</a>
</header>

<div class="card">
  <div class="profile-top">
    <img src="{{ user.profile_pic or 'https://cdn-icons-png.flaticon.com/512/3135/3135715.png' }}">
    <div>
      <h2>{{ user.name }}</h2>
      <p style="color:#888;font-size:13px">{{ user.store_name or 'My Store' }}</p>
      <p style="color:#888;font-size:12px">{{ user.phone }} • {{ user.location }}</p>
      {% if user.is_pro %}
      <span class="badge badge-pro">⭐ PRO Seller</span>
      {% else %}
      <span class="badge badge-free">Free Plan</span>
      {% endif %}
      {% if user.is_admin %}
      <span class="badge" style="background:#111827;color:#fff">Admin</span>
      {% endif %}
    </div>
  </div>
  <button class="btn btn-dark" onclick="openModal('editModal')">✏️ Edit Profile</button>
  <button class="btn" style="background:#f1f5f9" onclick="openModal('passModal')">🔒 Change Password</button>
  {% if user.is_admin %}
  <a href="/admin" style="display:block;text-align:center;background:#7c3aed;color:#fff;padding:12px;border-radius:12px;text-decoration:none;font-weight:800;margin-top:8px">⚙️ Open Admin Dashboard</a>
  {% endif %}
</div>

{% if not user.is_pro %}
<div class="card" style="background:linear-gradient(135deg,#f59e0b,#f97316);color:#fff">
  <h3>🚀 Go Pro - Sell More!</h3>
  <p style="font-size:13px;opacity:.95">Pro sellers get top placement + verified badge.</p>
  <div style="display:flex;gap:8px;margin-top:12px">
    <a href="/subscribe/Pro" style="flex:1;background:#fff;color:#111;padding:10px;border-radius:10px;text-align:center;text-decoration:none;font-weight:800;font-size:13px">Pro ₹199 / mo</a>
    <a href="/subscribe/Premium" style="flex:1;background:#111827;color:#fff;padding:10px;border-radius:10px;text-align:center;text-decoration:none;font-weight:800;font-size:13px">Premium ₹499 / mo</a>
  </div>
</div>
{% else %}
<div class="card" style="background:#dcfce7">
  <h3>✅ You are PRO</h3>
  {% if my_sub %}
  <p style="font-size:13px">Plan: {{ my_sub.plan }} - Status: {{ my_sub.status }}</p>
  {% endif %}
</div>
{% endif %}

<div class="tabs">
  <button class="active" onclick="showTab('myprod', this)">My Products</button>
  <button onclick="showTab('myord', this)">My Orders</button>
  <button onclick="showTab('shopord', this)">Shop Orders</button>
</div>

<div id="myprod" class="tab active">
  <div class="card">
    <h3>My Products ({{ products|length }})</h3>
    <div class="p-grid">
      {% for p in products %}
      <div class="p-card">
        <img src="{{ p.image }}">
        <div class="p-card-body">
          <b>{{ p.title }}</b>
          <div style="color:#16a34a;font-weight:900">₹{{ p.price }}</div>
          <div style="font-size:11px;color:#888">{{ p.category }} • ⭐ {{ p.rating or 0 }}</div>
          <div style="font-size:11px;margin-top:4px">
            {% if p.is_available %}
            <span style="color:#16a34a;font-weight:700">● Available</span>
            {% else %}
            <span style="color:#ef4444;font-weight:700">● Out of Stock</span>
            {% endif %}
          </div>
          <div style="display:flex;gap:6px;margin-top:8px">
            <a href="/toggle-available/{{ p.id }}" style="flex:1;text-align:center;background:#f59e0b;color:#fff;padding:6px;border-radius:8px;text-decoration:none;font-size:12px;font-weight:700">Toggle</a>
            <a href="/delete/{{ p.id }}" onclick="return confirm('Delete this product?')" style="flex:1;text-align:center;background:#ef4444;color:#fff;padding:6px;border-radius:8px;text-decoration:none;font-size:12px;font-weight:700">Delete</a>
          </div>
        </div>
      </div>
      {% else %}
      <p style="grid-column:1/-1;text-align:center;color:#888;padding:20px">No products yet. Add from Home page.</p>
      {% endfor %}
    </div>
  </div>
</div>

<div id="myord" class="tab">
  <div class="card">
    <h3>My Orders ({{ my_orders|length }})</h3>
    {% for o in my_orders %}
    <div class="order-card">
      <img src="{{ o.product_image }}">
      <div style="flex:1">
        <b>{{ o.product_title }}</b>
        <div style="font-size:12px;color:#888">{{ o.store_name }} • Qty: {{ o.qty }}</div>
        <div style="font-weight:800;color:#16a34a">₹{{ o.price }} - {{ o.status }}</div>
      </div>
    </div>
    {% else %}
    <p style="text-align:center;color:#888">No orders yet.</p>
    {% endfor %}
  </div>
</div>

<div id="shopord" class="tab">
  <div class="card">
    <h3>Shop Orders ({{ shop_orders|length }})</h3>
    {% for o in shop_orders %}
    <div class="order-card">
      <img src="{{ o.product_image }}">
      <div style="flex:1">
        <b>{{ o.product_title }}</b>
        <div style="font-size:12px;color:#888">Buyer: {{ o.buyer_name }} - {{ o.buyer_phone }}</div>
        <div style="font-weight:800">₹{{ o.price }} x {{ o.qty }} = ₹{{ (o.price|float * o.qty)|round(2) }}</div>
        <div style="font-size:12px">Status: <b>{{ o.status }}</b></div>
        <div style="display:flex;gap:6px;margin-top:6px">
          <a href="/order/status/{{ o.id }}/Accepted" style="background:#16a34a;color:#fff;padding:5px 10px;border-radius:8px;text-decoration:none;font-size:12px">Accept</a>
          <a href="/order/status/{{ o.id }}/Delivered" style="background:#111827;color:#fff;padding:5px 10px;border-radius:8px;text-decoration:none;font-size:12px">Delivered</a>
          <a href="/order/status/{{ o.id }}/Cancelled" style="background:#ef4444;color:#fff;padding:5px 10px;border-radius:8px;text-decoration:none;font-size:12px">Cancel</a>
          <a href="https://wa.me/91{{ o.buyer_phone }}" target="_blank" style="background:#25D366;color:#fff;padding:5px 10px;border-radius:8px;text-decoration:none;font-size:12px">WhatsApp</a>
        </div>
      </div>
    </div>
    {% else %}
    <p style="text-align:center;color:#888">No shop orders yet.</p>
    {% endfor %}
  </div>
</div><!-- EDIT MODAL -->
<div id="editModal" class="modal">
  <div class="modal-box">
    <button class="close" onclick="closeModal('editModal')">×</button>
    <h2>Edit Profile</h2>
    <form method="POST" action="/profile/edit" enctype="multipart/form-data">
      <label>Your Name</label>
      <input name="name" value="{{ user.name }}" required>
      <label>Store Name</label>
      <input name="store_name" value="{{ user.store_name or '' }}">
      <label>Phone</label>
      <input name="phone" value="{{ user.phone or '' }}">
      <label>Location</label>
      <input name="location" value="{{ user.location or '' }}">
      <label>Profile Photo</label>
      <input type="file" name="profile_pic" accept="image/*">
      <label>Shop Location - Tap on Map</label>
      <div id="map"></div>
      <input type="hidden" name="lat" id="lat" value="{{ user.lat or '' }}">
      <input type="hidden" name="lng" id="lng" value="{{ user.lng or '' }}">
      <p id="locText" style="font-size:12px;color:#16a34a;font-weight:700;margin-top:6px">
        {% if user.lat %}📍 Location Saved{% else %}Tap map to set your shop location{% endif %}
      </p>
      <button class="btn btn-green">Save Profile</button>
    </form>
  </div>
</div>

<!-- PASSWORD MODAL -->
<div id="passModal" class="modal">
  <div class="modal-box">
    <button class="close" onclick="closeModal('passModal')">×</button>
    <h2>Change Password</h2>
    <form method="POST" action="/profile/change-password">
      <label>Old Password</label>
      <input name="old_password" type="password" required>
      <label>New Password</label>
      <input name="new_password" type="password" required>
      <button class="btn btn-green">Change Password</button>
    </form>
  </div>
</div>

<div class="bottom">
  <a href="/">🏠<span>Home</span></a>
  <a href="/profile">➕<span>Add</span></a>
  <a href="/">🛒<span>Cart</span></a>
  <a href="/profile">👤<span>Profile</span></a>
</div>

<script>
function openModal(id) {
  document.getElementById(id).classList.add('open');
  if (id == 'editModal') {
    setTimeout(initMap, 200);
  }
}

function closeModal(id) {
  document.getElementById(id).classList.remove('open');
}

function showTab(id, btn) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
}

let mapInit = false;
let marker = null;

function initMap() {
  if (mapInit) return;
  mapInit = true;
  let lat = {{ user.lat or 17.9236 }};
  let lng = {{ user.lng or 75.1937 }};
  var m = L.map('map').setView([lat, lng], 13);
  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {attribution: '© Esri'}).addTo(m);
  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}').addTo(m);
  {% if user.lat and user.lng %}
  marker = L.marker([lat, lng]).addTo(m);
  {% endif %}
  m.on('click', function(e) {
    if (marker) m.removeLayer(marker);
    marker = L.marker([e.latlng.lat, e.latlng.lng]).addTo(m);
    document.getElementById('lat').value = e.latlng.lat;
    document.getElementById('lng').value = e.latlng.lng;
    document.getElementById('locText').innerText = '📍 Location Selected: ' + e.latlng.lat.toFixed(4) + ', ' + e.latlng.lng.toFixed(4);
  });
  setTimeout(() => m.invalidateSize(), 300);
}
</script>
</body>
</html>
.bottom a {
  text-decoration: none;
  color: #64748b;
  font-size: 12px;
  text-align: center;
  display: flex;
  flex-direction: column;
}
.toast {
  background: #16a34a;
  color: #fff;
  padding: 12px;
  text-align: center;
  font-weight: 700;
}
</style>
</head>
<body>
