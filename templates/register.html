<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register - LOCAL MARKET</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
body{background:#F8FFF9;font-family:'Segoe UI',sans-serif;display:flex;align-items:center;min-height:100vh}
.navbar{background:#0B6B3A!important}
.logo{font-weight:900;font-size:22px;color:#fff!important}
.logo span{color:#FF6B00}
.card-box{background:#fff;border-radius:22px;padding:28px;box-shadow:0 10px 30px rgba(0,0,0,.1);max-width:480px;margin:90px auto 20px}
.btn-green{background:#0B6B3A;color:#fff;font-weight:800;border-radius:12px;border:none;padding:12px}
.role-btn{border:2px solid #ddd;border-radius:14px;padding:12px;text-align:center;cursor:pointer;background:#fff}
.role-btn.active{border-color:#0B6B3A;background:#E8F5EE}
.role-btn input{display:none}
</style>
</head>
<body>

<nav class="navbar navbar-dark fixed-top">
<div class="container">
<a class="navbar-brand logo" href="/">LOCAL <span>MARKET</span></a>
<a href="/login" class="btn btn-light btn-sm fw-bold">Login</a>
</div>
</nav>

<div class="container">
<div class="card-box">

<h3 class="fw-bold text-center">👋 Namaskar!</h3>
<p class="text-center text-muted">Local Market madhe Welcome</p>

{% if error %}<div class="alert alert-danger fw-bold" style="border-radius:12px">{{ error }}</div>{% endif %}

<form method="POST" action="/register">
<label class="small fw-bold">Tumhi Kon Aahat?</label>
<div class="row g-2 mb-3">
<div class="col-6"><label class="role-btn w-100 active" onclick="selectRole(this,'customer')"><input type="radio" name="role" value="customer" checked>🛒<br><b>Customer</b><br><small class="text-muted">Shopping Karaychi</small></label></div>
<div class="col-6"><label class="role-btn w-100" onclick="selectRole(this,'seller')"><input type="radio" name="role" value="seller">🏪<br><b>Dukandar</b><br><small class="text-muted">Product Vikayche</small></label></div>
</div>

<label class="small fw-bold">Purn Nav</label>
<input name="name" class="form-control mb-2" placeholder="Ex: Sayali Patil" required>

<label class="small fw-bold">Mobile Number</label>
<input name="phone" class="form-control mb-2" placeholder="10 Anki Mobile - 9876543210" pattern="[0-9]{10}" required>

<label class="small fw-bold">Password</label>
<input name="password" type="password" class="form-control mb-2" placeholder="Password Tayar Kara" required>

<label class="small fw-bold">Gav / Area</label>
<select name="village" class="form-select mb-2">
<option value="">Gav Nivda</option>
{% for v in villages %}<option value="{{ v.name }}">{{ v.name }} - {{ v.taluka }}</option>{% endfor %}
<option value="Solapur">Solapur</option>
<option value="Pandharpur">Pandharpur</option>
<option value="Barshi">Barshi</option>
</select>

<div id="shop-fields" style="display:none">
<label class="small fw-bold">Dukanache Nav</label>
<input name="shop_name" class="form-control mb-2" placeholder="Ex: Patil Kirana Store">
<label class="small fw-bold">Dukanacha Prakar</label>
<select name="shop_type" class="form-select mb-2">
<option value="Kirana">Kirana</option>
<option value="Kapad">Kapad</option>
<option value="Mobile">Mobile</option>
<option value="Medical">Medical</option>
<option value="Bakery">Bakery</option>
<option value="General Store">General Store</option>
<option value="Other">Other</option>
</select>
</div>

<button class="btn btn-green w-100">✅ Account Banva</button>
</form>

<p class="text-center small mt-3 mb-0">Aadhi Account Aahe? <a href="/login" class="fw-bold">Login Kara</a></p>

</div>
</div>

<script>
function selectRole(el,role){
document.querySelectorAll('.role-btn').forEach(b=>b.classList.remove('active'));
el.classList.add('active');
document.getElementById('shop-fields').style.display = role=='seller' ? 'block' : 'none';
}
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
